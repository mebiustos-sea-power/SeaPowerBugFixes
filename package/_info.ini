[Language_en]
Name=Bug Fixes by MebiusTos
Description=A collection of Sea Power bug fixes. Fixes the world-view window failing to appear after closing the Esc menu. Requires Anchor Chain. Enable this mod, then restart Sea Power.

[Language_ja]
Name=Bug Fixes by MebiusTos
Description=Sea Powerの不具合修正集です。Escメニューを閉じた後にワールドビューの小窓が表示されなくなる問題を修正します。Anchor Chainが必要です。有効にした後、Sea Powerを再起動してください。
