[Language_en]
Name=Bug Fixes by MebiusTos
Description=A collection of Sea Power bug fixes. Fixes a formation-manager issue that prevents reselecting the same friendly unit after selecting an unidentified contact. Requires Anchor Chain. Enable this mod, then restart Sea Power.

[Language_ja]
Name=Bug Fixes by MebiusTos
Description=Sea Powerの不具合修正集です。不明接触の選択後に編隊マネージャーから同じ味方ユニットを再選択できない問題を修正します。Anchor Chainが必要です。有効にした後、Sea Powerを再起動してください。
