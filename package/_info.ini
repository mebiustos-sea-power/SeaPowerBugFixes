[Language_en]
Name=Bug Fixes by MebiusTos
Description=A collection of Sea Power bug fixes. Fixes a formation-manager issue that prevents reselecting the same friendly unit after selecting an unidentified contact. Also preserves each unit's Weapons Hold setting when issuing Cease Fire and restores mouse input after the battle context menu closes. Requires Anchor Chain. Enable this mod, then restart Sea Power.

[Language_ja]
Name=Bug Fixes by MebiusTos
Description=Sea Powerの不具合修正集です。不明接触の選択後に編隊マネージャーから同じ味方ユニットを再選択できない問題を修正します。「撃ち方やめ」で各ユニットの「武器使用禁止」設定が解除されることを防ぎ、戦闘中の右クリックメニューを閉じた後もマウス操作が制限されたままになる問題を修正します。Anchor Chainが必要です。有効にした後、Sea Powerを再起動してください。
